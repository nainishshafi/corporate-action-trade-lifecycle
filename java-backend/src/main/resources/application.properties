spring.application.name=corporate-action-lifecycle

# Disable Open Session in View: lazy loading must happen inside an explicit transaction,
# not implicitly during view rendering.
spring.jpa.open-in-view=false

# AI Reasoning Agent endpoint
ai.agent.url=http://localhost:8000/process
ai.agent.connect-timeout=2s
ai.agent.read-timeout=10s

# Resilience4j: circuit breaker + retry for the AI reasoning boundary
resilience4j.circuitbreaker.instances.aiAgent.slidingWindowSize=10
resilience4j.circuitbreaker.instances.aiAgent.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.aiAgent.failureRateThreshold=50
resilience4j.circuitbreaker.instances.aiAgent.waitDurationInOpenState=10s
resilience4j.retry.instances.aiAgent.maxAttempts=3
resilience4j.retry.instances.aiAgent.waitDuration=500ms
